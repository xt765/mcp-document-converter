[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-document-converter"
version = "0.1.3"
description = "MCP Document Converter - 支持多格式文档转换的 MCP 工具"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["mcp", "document", "converter", "markdown", "pdf", "docx", "html"]
authors = [
    { name = "MCP Document Converter", email = "example@example.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "markdown>=3.5.0",
    "beautifulsoup4>=4.12.0",
    "python-docx>=1.1.0",
    "PyPDF2>=3.0.0",
    "pdfplumber>=0.10.0",
    "chardet>=5.0.0",
    "pyyaml>=6.0.0",
    "pygments>=2.17.0",
    "jinja2>=3.1.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
weasyprint = [
    "weasyprint>=60.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "basedpyright>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
mcp-document-converter = "mcp_document_converter.server:main_sync"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_document_converter"]

[tool.pytest.ini_options]
addopts = "--cov=mcp_document_converter --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/mcp_document_converter"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
]

[tool.basedpyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
