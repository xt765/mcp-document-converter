name: Release

on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: |
        curl -LsS https://astral.sh/uv/install.sh | sh
        uv venv

    - name: Cache uv venv
      uses: actions/cache@v4
      with:
        path: .venv
        key: ${{ runner.os }}-uv-venv-${{ hashFiles('pyproject.toml') }}

    - name: Install dependencies
      run: uv sync --all-extras

    - name: Lint with Ruff
      run: uv run ruff check src tests

    - name: Check formatting with Ruff
      run: uv run ruff format --check src tests

    - name: Type check with Basedpyright
      run: uv run basedpyright src

    - name: Run tests with coverage
      run: uv run pytest --cov-report=xml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install uv
      run: curl -LsS https://astral.sh/uv/install.sh | sh

    - name: Build package
      run: uv build

    - name: Check distribution
      run: uvx twine check --strict dist/*

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  pypi-publish:
    name: Upload release to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-document-converter
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry-publish:
    name: Publish to MCP Registry
    needs: pypi-publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Update server.json version
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        python -c "
        import json
        with open('server.json', 'r') as f:
            data = json.load(f)
        data['version'] = '$VERSION'
        for pkg in data.get('packages', []):
            pkg['version'] = '$VERSION'
        with open('server.json', 'w') as f:
            json.dump(data, f, indent=2)
        "

    - name: Download mcp-publisher
      run: |
        curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

    - name: Authenticate to MCP Registry
      run: ./mcp-publisher login github-oidc

    - name: Publish server to MCP Registry
      run: ./mcp-publisher publish
